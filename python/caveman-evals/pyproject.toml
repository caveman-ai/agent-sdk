[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "caveman-evals"
version = "0.1.0"
description = "Local-first evals for agents on Caveman Cloud — Eval(), ComputerEval(), 1-line LLM tracing, and CI diffs."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = []

[project.scripts]
caveman-eval = "caveman_evals.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["caveman_evals*"]
