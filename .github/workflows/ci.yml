name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15]
        node: [22.19.0, 24.18.0]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            examples/coding-agent/package-lock.json
      - run: npm ci
      - run: npm --prefix packages/pebble-protocol run build
      - run: npm ci --prefix examples/coding-agent --ignore-scripts
      - run: npm test
      - run: npm run license:check
      - run: npm run pack:check

  postgres:
    # Service containers are Linux-only, and the durability suite is the only
    # thing here that needs a real server, so it gets its own job rather than
    # slowing the whole matrix down.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: caveman
          POSTGRES_DB: caveman
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22.19.0
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm --prefix packages/pebble-protocol run build
      - run: npm --prefix packages/agent run build
      # Fails rather than skips if the server is unreachable: "postgres is
      # covered" must not be able to go quietly untrue.
      - run: node --test packages/agent/tests/durable-postgres.runtime.mjs
        env:
          CAVEMAN_TEST_POSTGRES_URL: postgres://postgres:caveman@127.0.0.1:5432/caveman

  clean-room:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22.19.0
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run build
      # Pack every publishable workspace, then install the tarballs into a
      # throwaway project outside the checkout. Fails if a package ships a
      # local dependency spec, misses a file, or breaks its documented entry
      # points. No provider credential, so this exercises packaging only.
      - run: npm pack --workspaces --pack-destination "$RUNNER_TEMP/tgz"
      - name: Install packed tarballs and run documented entry points
        working-directory: ${{ runner.temp }}
        run: |
          mkdir clean-room && cd clean-room
          npm init -y >/dev/null
          npm install "$RUNNER_TEMP"/tgz/*.tgz react
          node --input-type=module -e '
            const m = await import("@caveman-ai/agent");
            for (const name of ["agent", "auto", "run", "tool", "schema"]) {
              if (!(name in m)) throw new Error(`missing_export:${name}`);
            }
            await import("@caveman-ai/agent/serve");
            await import("@caveman-ai/agent/wire");
            await import("@pebble-agent/protocol");
            const react = await import("@caveman-ai/react");
            if (typeof react.useAgent !== "function") throw new Error("missing_export:useAgent");
          '
          npx --no-install caveman-agent --version

  windows-portability:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 24.18.0
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm --prefix packages/pebble-protocol run build
      - run: npm --prefix packages/agent run build
      - run: node --test packages/agent/tests/windows-process.runtime.mjs packages/agent/tests/windows-shell-smoke.runtime.mjs
